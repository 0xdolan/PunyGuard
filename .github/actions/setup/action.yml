name: Setup
description: Install pnpm (from packageManager), Node (from .nvmrc), and workspace dependencies.

runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup reads package.json#packageManager,
    # and passing both is an error when they differ.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
