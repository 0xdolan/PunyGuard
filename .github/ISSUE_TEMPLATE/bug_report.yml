name: Bug report
description: Something is wrong, including a false positive (safe domain flagged)
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PunyGuard version
      description: Shown in the popup footer.
      placeholder: v0.0.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Firefox, Safari, Other Chromium]
    validations:
      required: true
  - type: input
    id: hostname
    attributes:
      label: Page or hostname
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
