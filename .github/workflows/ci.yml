name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit-message checks need history
      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm format:check

      - name: Version consistency
        run: pnpm version:check

      - name: No en/em dashes (files and new commit messages)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="$PUSH_BEFORE..$GITHUB_SHA"
          else range="-1"; fi
          echo "checking commits: $range"
          pnpm lint:dashes --commits "$range"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Smoke tests
        run: pnpm test:e2e

  build:
    name: Build (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Brave, Opera, and Vivaldi install the chrome build.
        browser: [chrome, edge, firefox, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Zip extension
        run: pnpm --filter @punyguard/extension exec wxt zip -b ${{ matrix.browser }}

      - name: Lint Firefox package (AMO rules)
        if: matrix.browser == 'firefox'
        run: pnpm lint:amo

      - uses: actions/upload-artifact@v4
        with:
          name: punyguard-${{ matrix.browser }}
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # The zips live in WXT's dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

  safari-xcode:
    name: Safari Xcode project
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm safari:xcode

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm site:build
