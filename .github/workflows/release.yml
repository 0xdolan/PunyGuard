name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Tag matches version and changelog
        run: pnpm version:check --tag "${GITHUB_REF_NAME}" --notes "${RUNNER_TEMP}/notes.md"

      # Chrome (also Brave/Opera/Vivaldi), Edge, Firefox (+ AMO sources zip), Safari
      - name: Build store packages
        run: pnpm zip:all

      - name: Checksums
        working-directory: apps/extension/.output
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PunyGuard ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            apps/extension/.output/*.zip
            apps/extension/.output/SHA256SUMS.txt
          fail_on_unmatched_files: true
