name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  safari-xcode:
    name: Safari Xcode project
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build and zip the Xcode project
        run: |
          pnpm safari:xcode
          cd apps/extension
          zip -qr "$RUNNER_TEMP/punyguard-${GITHUB_REF_NAME#v}-safari-xcode.zip" safari

      - uses: actions/upload-artifact@v4
        with:
          name: safari-xcode
          path: ${{ runner.temp }}/*-safari-xcode.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ci, safari-xcode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Tag matches version and changelog
        run: pnpm version:check --tag "${GITHUB_REF_NAME}"

      # Chrome (also Brave/Opera/Vivaldi), Edge, Firefox (+ AMO sources zip), Safari
      - name: Build store packages
        run: pnpm zip:all

      - uses: actions/download-artifact@v8
        with:
          name: safari-xcode
          path: ${{ runner.temp }}/xcode

      - name: Stage packages, checksums, and notes
        run: |
          node scripts/stage-release.mjs \
            --safari-xcode "$(ls "$RUNNER_TEMP"/xcode/*-safari-xcode.zip)"
          ls -l release

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PunyGuard ${{ github.ref_name }}
          body_path: release/notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.zip
            release/*.xpi
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

  # Submits the version to the listed add-on on addons.mozilla.org, with the
  # source zip and the changelog section as release notes. Mozilla reviews it
  # and publishes it to Firefox users. Needs the AMO_JWT_ISSUER and
  # AMO_JWT_SECRET secrets (https://addons.mozilla.org/developers/addon/api/key/);
  # without them this job only reports that it was skipped.
  publish-firefox:
    name: Publish to addons.mozilla.org
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check for AMO credentials
        id: creds
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AMO_JWT_ISSUER/AMO_JWT_SECRET not set; skipping the Firefox store upload."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: ./.github/actions/setup
        if: steps.creds.outputs.ok == 'true'

      - name: Build Firefox package and sources zip
        if: steps.creds.outputs.ok == 'true'
        run: pnpm zip:firefox

      - name: Release notes from the changelog
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/amo-metadata.mjs "$RUNNER_TEMP/amo-metadata.json"

      - name: Submit to addons.mozilla.org (listed)
        if: steps.creds.outputs.ok == 'true'
        run: |
          V="${GITHUB_REF_NAME#v}"
          npx --yes web-ext@8.10.0 sign --channel listed \
            --source-dir apps/extension/.output/firefox-mv3 \
            --upload-source-code "apps/extension/.output/punyguard-$V-sources.zip" \
            --amo-metadata "$RUNNER_TEMP/amo-metadata.json" \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir "$RUNNER_TEMP/amo"

  # Uploads the version to the Chrome Web Store item and submits it for review.
  # Needs the CWS_* secrets (see docs/store/chrome.md, "Automatic updates");
  # without them this job only reports that it was skipped.
  publish-chrome:
    name: Publish to the Chrome Web Store
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Check for Chrome Web Store credentials
        id: creds
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ] \
            && [ -n "$PUBLISHER_ID" ] && [ -n "$EXTENSION_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CWS_* secrets not set; skipping the Chrome Web Store upload."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: ./.github/actions/setup
        if: steps.creds.outputs.ok == 'true'

      - name: Build Chrome package
        if: steps.creds.outputs.ok == 'true'
        run: pnpm zip

      - name: Upload and submit for review
        if: steps.creds.outputs.ok == 'true'
        run: |
          V="${GITHUB_REF_NAME#v}"
          npx --yes chrome-webstore-upload-cli@4.0.2 \
            --source "apps/extension/.output/punyguard-$V-chrome.zip"
